name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: pytest -q -rs

      - name: Run the example and the independent-reference verification
        run: |
          python examples/demo_transport_1d.py
          python benchmarks/verify_reference.py --out /tmp/verification

      - name: Build wheel and smoke-test it in a clean environment
        run: |
          pip install build
          python -m build --wheel -o dist .
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/ensemble-da --version
          /tmp/smoke/bin/python -c "import ensemble_da; print(ensemble_da.__version__)"
